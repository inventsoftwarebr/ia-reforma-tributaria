name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      # Garante que o schema Drizzle e as migrations não divergiram:
      # se `generate` produzir arquivo novo, falta commitar a migration.
      - name: Migrations em dia
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "Schema alterado sem migration commitada:"
            git status --porcelain db/migrations
            exit 1
          fi

      - name: Build
        run: pnpm build
        env:
          APP_URL: http://localhost:3000
          EVOLUTION_API_URL: http://localhost:8080
          EVOLUTION_API_KEY: ci
          EVOLUTION_INSTANCE: ci
          EVOLUTION_WEBHOOK_SECRET: ci-secret-with-16-chars
          AI_MODEL: claude-sonnet-5
          SIMULATOR_URL: https://lp.inventsoftware.com.br/simulador-reforma-tributaria/
