name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      # Se `generate` produzir arquivo novo, falta commitar a migration ou
      # regenerar o bootstrap.
      - name: Migration e bootstrap em dia
        run: |
          pnpm db:generate
          pnpm db:bootstrap-sql
          if [ -n "$(git status --porcelain db)" ]; then
            echo "Schema alterado sem migration/bootstrap commitados:"
            git status --porcelain db
            exit 1
          fi

      - name: Build
        run: pnpm build
        env:
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci
          EVOLUTION_API_URL: http://localhost:8080
          EVOLUTION_API_KEY: ci
          EVOLUTION_INSTANCE: ci
          EVOLUTION_WEBHOOK_SECRET: ci-secret-with-16-chars
          AI_MODEL: gemini-3.5-flash

  # Aplica o SQL de verdade: bootstrap.sql é o que alguém cola no SQL Editor
  # do Supabase, então precisa rodar limpo num banco novo.
  banco:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ia_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O Supabase tem auth.users; um Postgres puro não. Criar uma versão mínima
      # faz o bootstrap instalar o gatilho de perfil, que o teste de RLS usa.
      - name: Simular o schema auth do Supabase
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -q -c "
            create schema auth;
            create table auth.users (id uuid primary key, email text, raw_user_meta_data jsonb);"

      - name: Aplicar bootstrap.sql
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -q -f db/bootstrap.sql

      # Conferência que a pessoa roda no SQL Editor: nenhuma linha pode dar NÃO.
      - name: Conferência do SQL Editor
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/check-supabase.sql | tee /tmp/check.txt
          if grep -q "NÃO" /tmp/check.txt; then exit 1; fi

      # Exercita as políticas com um papel sem BYPASSRLS e JWT simulado: anônimo
      # e usuário sem perfil não veem nada, atendente não altera a base nem se
      # promove, admin faz curadoria.
      - name: RLS de ponta a ponta
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/verify-rls.sql

      - name: Verificar estrutura, RLS, idempotência e busca na base
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/verify-bootstrap.sql

      - name: db:migrate é no-op depois do bootstrap
        run: pnpm db:migrate

      - name: db:sql é idempotente
        run: pnpm db:sql

      - name: Verificar de novo
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f scripts/verify-bootstrap.sql

      - name: bootstrap.sql roda só uma vez
        run: |
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -q -f db/bootstrap.sql 2>/tmp/err; then
            echo "bootstrap.sql rodou duas vezes sem abortar"
            exit 1
          fi
          grep -q "já inicializado" /tmp/err || { cat /tmp/err; exit 1; }
